name: TutorInn CI

on:
  push:
    branches:
      - main
      - feature/profile-ownership-interests-multi-subjects
      - feat/44-personal-learning-tasks-group-assignments
      - feat/45-admin-security-deployment
  pull_request:
    branches:
      - main
      - feat/43-auth-profiles-dashboards
      - feat/44-personal-learning-tasks-group-assignments

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tutorinn
          POSTGRES_PASSWORD: tutorinn_test
          POSTGRES_DB: tutorinn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutorinn -d tutorinn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run backend workflow tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://tutorinn:tutorinn_test@localhost:5432/tutorinn_test
        run: pytest -q
      - name: Run PostgreSQL account-deletion integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tutorinn:tutorinn_test@localhost:5432/tutorinn_test
          TEST_POSTGRES_URL: postgresql+psycopg://tutorinn:tutorinn_test@localhost:5432/tutorinn_test
        run: |
          pytest -q tests/test_auth_workflows.py -k "test_account_only_deletion_commits_retention_and_recovery_token_and_allows_resend or test_admin_must_explain_deletion_scope_override_and_email_the_reason"
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend automated tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
